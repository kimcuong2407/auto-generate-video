name: CI/CD

on:
  push:
    branches: [master] # push master → CI + deploy
  pull_request: {} # PR → chỉ CI
  workflow_dispatch: {} # cho phép bấm tay khi cần

concurrency: # tránh 2 lần chạy chồng nhau trên cùng ref
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # Next 14.2 cần Node >=18.17; dùng 20 LTS
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  deploy:
    needs: ci
    # chỉ deploy khi push (hoặc bấm tay) trên nhánh master — PR không deploy
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy lên VPS qua SSH + PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }} # bỏ trống = 22
          script: |
            set -e
            # Hard-code tên process PM2 (không đổi) — tránh sự cố secret rỗng khiến
            # `pm2 reload ""` reload/đẻ nhầm process tên rỗng, còn review-app không được
            # reload → domain vẫn chạy bundle cũ dù code mới đã build.
            APP_NAME="review-app"
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch --all
            git reset --hard origin/master
            npm ci
            npm run build
            # Áp migration DB (tạo/đổi bảng) trước khi reload app. Idempotent: drizzle-kit
            # bỏ qua migration đã chạy. Cần DB_* trong .env.local trên VPS (drizzle.config
            # tự nạp .env.local). Fail ở đây sẽ dừng deploy (set -e) → không reload bundle lỗi.
            npm run db:migrate
            # drizzle-kit migrate có thể exit 0 mà KHÔNG áp gì (vào nhầm database, journal lệch,
            # thiếu file .sql) — khi đó deploy vẫn xanh và app reload với schema thiếu bảng, lỗi
            # chỉ lộ lúc người dùng bấm nút. So hash từng migration với __drizzle_migrations để
            # chặn ngay tại đây; set -e dừng trước khi reload nên app cũ vẫn phục vụ bình thường.
            npm run db:verify
            # Chỉ reload khi process đã tồn tại; nếu chưa có mới start (tránh đẻ process trùng tên).
            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 reload "$APP_NAME" --update-env
            else
              pm2 start npm --name "$APP_NAME" -- start
            fi
            pm2 save
