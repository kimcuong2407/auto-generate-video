<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        color: #1f2937;
        background: #fff;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #6b7280;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 9px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        padding: 9px;
        border: none;
        border-radius: 6px;
        background: #ee4d2d;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .ok {
        color: #059669;
      }
      .err {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <h1>🛍️ Shopee Product Grabber</h1>
    <label>Endpoint URL (app nhận data)</label>
    <input id="endpoint" type="text" placeholder="http://localhost:3000/api/shopee/ingest" />
    <button id="send">Gửi data</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
